name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"      # nightly — the Ollama suite below
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Runtime deps not yet on PyPI — install the chain bottom-up from git so
          # pip never tries to resolve them from PyPI when installing cogno-anima.
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install "cogno-synapse @ git+https://github.com/sudoers-ai/cogno-synapse.git"
          pip install "cogno-anima @ git+https://github.com/sudoers-ai/cogno-anima.git"
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cogno_soma tests examples
      - name: Type-check (mypy)
        run: mypy cogno_soma
      - name: Unit tests
        run: pytest tests/unit -q --cov=cogno_soma --cov-report=term-missing --cov-fail-under=90

  # ── the live-pipeline suite, which until now ran nowhere ───────────────────────────────
  #
  # `tests/integration/test_e2e_live.py` drives the real NOUMENO→NER→ID→EGO→SUPEREGO chain over
  # a model, which is the only thing that proves this orchestrator wires the stages correctly —
  # and it gates on a live Ollama the `test` job does not have, so it skipped silently.
  #
  # NOT a PR gate: it asserts on a real model's behaviour, so making it a merge gate would make
  # a green main depend on sampling. Nightly + manual gives the signal without the noise.
  ollama-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama + pull the models the suite asks for
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break || sleep 1; done
          ollama pull mistral:latest          # GEN_MODEL in test_e2e_live
          ollama pull nomic-embed-text:latest # EMBED_MODEL
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration suite (real model)
        env:
          # This runner has no GPU. cogno-synapse defaults to a 120 s per-call timeout, which
          # is right for a GPU box and short for ONE generation on a 7B model here: the
          # 2026-08-04 nightly died on httpx.ReadTimeout with nothing wrong but the clock.
          COGNO_OLLAMA_TIMEOUT: "600"
        # The assert first: the variable only does anything on cogno-synapse >= 0.1.2, and pip
        # resolving an older one would silently restore 120 s and turn this job red again for a
        # reason the log would not name. Fail on the cause, not the symptom.
        run: |
          python - <<'EOF'
          import os
          from cogno_synapse import OllamaBackend
          want = int(os.environ["COGNO_OLLAMA_TIMEOUT"])
          got = OllamaBackend(model="probe").timeout
          assert got == want, (
              f"installed cogno-synapse ignores COGNO_OLLAMA_TIMEOUT (timeout={got}, "
              f"expected {want}) — needs >= 0.1.2, or this job times out on a CPU runner")
          print(f"ollama timeout = {got}s")
          EOF
          pytest tests/integration -q
